<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 170" width="1280" height="170" role="img" aria-label="6+ years, 2 production platforms, 259 API endpoints, 46 data models, 740+ commits in 2026" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sbase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1B2D"/>
      <stop offset="100%" stop-color="#16263D"/>
    </linearGradient>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .n { font-size: 42px; font-weight: 800; fill: #E8DCC8; letter-spacing: -1px; }
      .l { font-size: 13px; font-weight: 500; fill: #5E7C99; }
    </style>
  </defs>

  <rect width="1280" height="170" fill="url(#sbase)"/>
  <rect x="0" y="0" width="1280" height="3" fill="#D99C4A" fill-opacity="0.55"/>

  <g stroke="#5E7C99" stroke-opacity="0.22" stroke-width="1">
    <line x1="299" y1="52" x2="299" y2="128"/>
    <line x1="526" y1="52" x2="526" y2="128"/>
    <line x1="753" y1="52" x2="753" y2="128"/>
    <line x1="980" y1="52" x2="980" y2="128"/>
  </g>

  <g class="f" text-anchor="middle">
    <text class="n" x="185" y="97">6+</text>
    <text class="l" x="185" y="123">years building for the web</text>

    <text class="n" x="412" y="97">2</text>
    <text class="l" x="412" y="123">production platforms live</text>

    <text class="n" x="639" y="97" fill="#D99C4A">259</text>
    <text class="l" x="639" y="123">API endpoints shipped</text>

    <text class="n" x="866" y="97">46</text>
    <text class="l" x="866" y="123">PostgreSQL models designed</text>

    <text class="n" x="1093" y="97">740+</text>
    <text class="l" x="1093" y="123">commits in 2026</text>
  </g>
</svg>
