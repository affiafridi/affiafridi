  <circle cx="1000" cy="170" r="13" fill="#D99C4A"/>
  <circle cx="1000" cy="170" r="24" fill="none" stroke="#D99C4A" stroke-opacity="0.3" stroke-width="1.25"/>

  <!-- type -->
  <text class="f" x="72" y="142" fill="#E8DCC8" font-size="62" font-weight="800" letter-spacing="-1.8">Aftab Afridi</text>
  <text class="f" x="74" y="184" fill="#E8DCC8" fill-opacity="0.85" font-size="21" font-weight="500">Full-stack developer in Dubai</text>
  <text class="f" x="74" y="215" fill="#5E7C99" font-size="16" font-weight="400">Production platforms, real-time systems, and the schemas underneath.</text>

  <rect x="74" y="248" width="220" height="2" fill="url(#rule)"/>
  <text class="f" x="74" y="278" fill="#5E7C99" font-size="14" font-weight="500" letter-spacing="0.3">Next.js &#160; TypeScript &#160; Python &#160; PostgreSQL &#160; WordPress</text>
