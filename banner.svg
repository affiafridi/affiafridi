<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Aftab Afridi — Full-stack developer in Dubai" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1B2D"/>
      <stop offset="100%" stop-color="#16263D"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D99C4A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D99C4A" stop-opacity="0"/>
    </linearGradient>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#base)"/>

  <!-- relation graph: hub-and-spoke, echoing a database schema -->
  <g stroke="#5E7C99" stroke-opacity="0.45" stroke-width="1.25" fill="none">
    <path d="M1000 170 L940 110"/>
    <path d="M1000 170 L1050 90"/>
    <path d="M1000 170 L1130 140"/>
    <path d="M1000 170 L900 210"/>
    <path d="M1000 170 L1080 220"/>
    <path d="M1130 140 L1080 220"/>
    <path d="M1080 220 L1180 195"/>
    <path d="M940 110 L900 210"/>
    <path d="M1050 90 L1130 140"/>
  </g>
  <g fill="none" stroke="#5E7C99" stroke-opacity="0.8" stroke-width="1.5">
    <circle cx="940" cy="110" r="9"/>
    <circle cx="1050" cy="90" r="6"/>
    <circle cx="1130" cy="140" r="9"/>
    <circle cx="900" cy="210" r="6"/>
    <circle cx="1080" cy="220" r="9"/>
    <circle cx="1180" cy="195" r="6"/>
